name: Build FLV timing diagnostic image

on:
  push:
    branches: [codex/recording-integration]
    paths:
      - docker/go2rtc/**
      - docker/go2rtc-diagnostics/**
      - viseron/components/ffmpeg/stream.py
      - viseron/components/storage/**
      - tests/components/storage/test_polling.py
      - tests/components/storage/test_segment_moves.py
      - .github/workflows/build-flv-diagnostics.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Fetch pinned go2rtc source
        run: |
          git clone --depth 1 --branch v1.9.14 https://github.com/AlexxIT/go2rtc.git "$RUNNER_TEMP/go2rtc"
          test "$(git -C "$RUNNER_TEMP/go2rtc" rev-parse HEAD)" = b5948cfb25404cc5cb37b166ecaa2dca20b11d4b
          git -C "$RUNNER_TEMP/go2rtc" apply "$GITHUB_WORKSPACE/docker/go2rtc-diagnostics/timing.patch"
          git -C "$RUNNER_TEMP/go2rtc" apply "$GITHUB_WORKSPACE/docker/go2rtc/flv-audio-timestamps.patch"
          git -C "$RUNNER_TEMP/go2rtc" apply "$GITHUB_WORKSPACE/docker/go2rtc/flv-audio-recovery.patch"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: ${{ runner.temp }}/go2rtc/go.sum
      - name: Test diagnostics, packet equivalence, and synthetic timestamp gaps
        run: |
          cd "$RUNNER_TEMP/go2rtc"
          go test -race ./pkg/core ./pkg/flv ./internal/api ./pkg/rtsp ./internal/streams/recoverytest
          go test -race ./pkg/aac -run 'TestBuggy_RTSP_AAC|TestRTPPay'
          go test ./pkg/flv -run TestLegacyAACSampleClockCompressesTimestampGaps -v
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$GITHUB_WORKSPACE/docker/go2rtc-diagnostics/go2rtc" .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build diagnostic overlay
        timeout-minutes: 8
        run: |
          cp viseron/components/ffmpeg/stream.py docker/go2rtc-diagnostics/stream.py
          cp -R viseron/components/storage docker/go2rtc-diagnostics/storage
          docker build --build-arg DIAGNOSTIC_COMMIT="$GITHUB_SHA" \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" \
            docker/go2rtc-diagnostics
      - name: Verify storage polling and safe publication
        timeout-minutes: 10
        run: |
          docker run --rm --user postgres --entrypoint /bin/sh \
            --tmpfs /segments:rw,mode=1777 --tmpfs /thumbnails:rw,mode=1777 \
            --tmpfs /event_clips:rw,mode=1777 --tmpfs /snapshots:rw,mode=1777 \
            -v "$GITHUB_WORKSPACE/tests:/src/tests:ro" \
            -e PYTHONPATH=/tmp/testdeps:/src -e VISERON_TESTS=true \
            -w /src \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" -c '
            python3 -m pip install --quiet --target /tmp/testdeps \
              pytest==9.1.1 pytest-postgresql==9.1.1 pytest-mock==3.17.0 pytest-alembic==0.13.1 "psycopg[binary]" &&
            python3 -m pytest -q -o addopts= -p no:cacheprovider \
              tests/components/storage/test_polling.py \
              tests/components/storage/test_config.py \
              tests/components/storage/test_move_safety.py \
              tests/components/storage/test_tier_markers.py \
              tests/components/storage/test_hold_retry.py \
              tests/components/storage/test_segment_moves.py \
              tests/components/storage/test_journal_db_prototype.py \
              tests/components/storage/test_pressure_policy.py \
              tests/components/storage/test_migrations.py \
              tests/components/storage/test_tier_handler.py \
              tests/components/storage/test_jobs.py \
              tests/components/storage/test_asset_move_recovery.py'
      - name: Exercise synthetic FLV stall inside the candidate image
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/flv-shadow"
          for scenario in steady gap camera-catchup; do
            docker run --rm --network host --entrypoint python3 \
            -v "$GITHUB_WORKSPACE/docker/go2rtc-diagnostics:/diagnostics:ro" \
            -v "$RUNNER_TEMP/flv-shadow:/tmp" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" \
            /diagnostics/shadow_flv_test.py /usr/local/bin/go2rtc --case "$scenario"
          done
          docker run --rm --network none --entrypoint python3 \
            -v "$GITHUB_WORKSPACE/docker/go2rtc-diagnostics:/diagnostics:ro" \
            -v "$RUNNER_TEMP/flv-shadow:/tmp" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" \
            /diagnostics/audio_recovery_test.py /usr/local/bin/go2rtc --viseron-audio
          for attempt in 1 2 3; do
            docker run --rm --network none --entrypoint python3 \
              -v "$GITHUB_WORKSPACE/docker/go2rtc-diagnostics:/diagnostics:ro" \
              -v "$RUNNER_TEMP/flv-shadow:/tmp" \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" \
              /diagnostics/audio_recovery_test.py /usr/local/bin/go2rtc \
              --viseron-audio --case metadata_omits_audio
          done
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run existing container smoke tests
        env:
          VISERON_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-artifacts
        run: |
          pip install -r requirements_container_test.txt
          pytest -rs tests/container/ --confcutdir=tests/container \
            --image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}" \
            --arch=amd64 --boot-timeout=240 --timeout=300 -v
      - name: Make synthetic test artifacts readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/flv-shadow" ]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/flv-shadow"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flv-diagnostic-smoke-artifacts
          path: |
            ${{ runner.temp }}/smoke-artifacts
            ${{ runner.temp }}/flv-shadow
          if-no-files-found: ignore
      - name: Publish tested image
        run: docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/viseron:flv-diagnostics-${GITHUB_SHA}"
