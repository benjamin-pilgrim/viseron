logger:
  default_level: info
storage:
  recorder:
    tiers:
      - path: /ram
        promote_after: 0
        promotion_batch_interval: 0
        check_interval:
          seconds: 5
        continuous:
          max_size:
            percent: 40
        events:
          max_size:
            percent: 20
        on_full:
          policy: preserve_events
      - path: /archive
        continuous:
          max_age:
            days: 1
        events:
          max_age:
            days: 1
go2rtc:
  api:
    listen: 127.0.0.1:1984
  rtsp:
    listen: 127.0.0.1:8554
  webrtc:
    listen: ""
  streams:
    recovery: http://127.0.0.1:18080/video_only
ffmpeg:
  camera:
    recovery:
      name: Synthetic recovery
      host: 127.0.0.1
      port: 8554
      path: /recovery
      stream_format: rtsp
      width: 160
      height: 120
      fps: 20
      codec: h264
      audio_codec: null
      hwaccel_args: []
      ffmpeg_loglevel: warning
      recorder:
        codec: copy
        lookback: 2
        create_event_clip: true
        continuous_recording: true
        timestamp_mode: source
nvr:
  recovery:
